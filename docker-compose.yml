# ═══════════════════════════════════════════════════════════════════════════
#  AgroSense Mesh – docker-compose.yml
#  Topologia: RabbitMQ | Gateway | 3x Workers | PG Primary + PG Replica Real | Web | Sensors
# ═══════════════════════════════════════════════════════════════════════════

# ─── Volumes Persistentes ───────────────────────────────────────────────────
volumes:
  rabbitmq_data:
  postgres_primary_data:
  postgres_replica_data:

# ─── Redes Internas ────────────────────────────────────────────────────────
networks:
  mesh_net:
    driver: bridge
  election_net:
    driver: bridge

# ─── Serviços ──────────────────────────────────────────────────────────────
services:

  # ── 1. RabbitMQ Broker ─────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: agrosense-rabbitmq
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - mesh_net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 8s
      timeout: 5s
      retries: 10

  # ── 2. PostgreSQL Primary (Escrita / Master) ────────────────────────────
  postgres-primary:
    image: postgres:16-alpine
    container_name: agrosense-pg-primary
    hostname: postgres-primary
    environment:
      POSTGRES_DB:       agrosense
      POSTGRES_USER:     agro
      POSTGRES_PASSWORD: agro123
      POSTGRES_HOST_AUTH_METHOD: trust
      PGDATA:            /var/lib/postgresql/data
    ports:
      - "5432:5432"
    volumes:
      - postgres_primary_data:/var/lib/postgresql/data
      - ./infra/00-replication.sh:/docker-entrypoint-initdb.d/00-replication.sh
      - ./infra/pg-init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./infra/primary-entrypoint.sh:/primary-entrypoint.sh
    entrypoint: ["/bin/sh", "/primary-entrypoint.sh"]
    networks:
      - mesh_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agro -d agrosense"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  # ── 3. PostgreSQL Replica (Leitura / Standby Streaming Replication) ────
  postgres-replica:
    image: postgres:16-alpine
    container_name: agrosense-pg-replica
    hostname: postgres-replica
    environment:
      POSTGRES_DB:       agrosense
      POSTGRES_USER:     agro
      POSTGRES_PASSWORD: agro123
      POSTGRES_HOST_AUTH_METHOD: trust
      PGPASSWORD:        agro123
      PGDATA:            /var/lib/postgresql/data
    ports:
      - "5433:5432"
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
      - ./infra/replica-entrypoint.sh:/replica-entrypoint.sh
    networks:
      - mesh_net
    depends_on:
      postgres-primary:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/replica-entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agro -d agrosense"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 120s
    restart: unless-stopped

  # ── 4. Gateway gRPC ─────────────────────────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: server/gateway/Dockerfile
    container_name: agrosense-gateway
    environment:
      GRPC_PORT:    "50051"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672"
    ports:
      - "50051:50051"
    networks:
      - mesh_net
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # ── 5. Worker Node 1 ────────────────────────────────────────────────────
  worker-1:
    build:
      context: ./server/worker
      dockerfile: Dockerfile
    container_name: agrosense-worker-1
    environment:
      NODE_ID:      "1"
      ALL_NODES:    "1,2,3"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672"
      DB_HOST:      "postgres-primary"
      DB_PORT:      "5432"
      DB_NAME:      "agrosense"
      DB_USER:      "agro"
      DB_PASSWORD:  "agro123"
      WEB_URL:      "http://web:3000"
    ports:
      - "9001:9001"  # Porta de eleição TCP Bully
    networks:
      - mesh_net
      - election_net
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres-primary:
        condition: service_healthy
    restart: unless-stopped

  # ── 6. Worker Node 2 ────────────────────────────────────────────────────
  worker-2:
    build:
      context: ./server/worker
      dockerfile: Dockerfile
    container_name: agrosense-worker-2
    environment:
      NODE_ID:      "2"
      ALL_NODES:    "1,2,3"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672"
      DB_HOST:      "postgres-primary"
      DB_PORT:      "5432"
      DB_NAME:      "agrosense"
      DB_USER:      "agro"
      DB_PASSWORD:  "agro123"
      WEB_URL:      "http://web:3000"
    ports:
      - "9002:9002"  # Porta de eleição TCP Bully
    networks:
      - mesh_net
      - election_net
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres-primary:
        condition: service_healthy
    restart: unless-stopped

  # ── 7. Worker Node 3 ────────────────────────────────────────────────────
  worker-3:
    build:
      context: ./server/worker
      dockerfile: Dockerfile
    container_name: agrosense-worker-3
    environment:
      NODE_ID:      "3"
      ALL_NODES:    "1,2,3"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672"
      DB_HOST:      "postgres-primary"
      DB_PORT:      "5432"
      DB_NAME:      "agrosense"
      DB_USER:      "agro"
      DB_PASSWORD:  "agro123"
      WEB_URL:      "http://web:3000"
    ports:
      - "9003:9003"  # Porta de eleição TCP Bully
    networks:
      - mesh_net
      - election_net
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres-primary:
        condition: service_healthy
    restart: unless-stopped

  # ── 8. Simulador de Sensores (Client) ────────────────────────────────────
  sensor-simulator:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: agrosense-sensor-simulator
    environment:
      GATEWAY_ADDR: "gateway:50051"
      INTERVAL_MS:  "2000"
    networks:
      - mesh_net
    depends_on:
      - gateway
    restart: unless-stopped

  # ── 9. Dashboard Web (Fastify + WS) ─────────────────────────────────────
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: agrosense-web
    environment:
      WEB_PORT:     "3000"
      DB_HOST:      "postgres-replica"
      DB_PORT:      "5432"
      DB_NAME:      "agrosense"
      DB_USER:      "agro"
      DB_PASSWORD:  "agro123"
    ports:
      - "3000:3000"
    networks:
      - mesh_net
    depends_on:
      postgres-replica:
        condition: service_healthy
    restart: unless-stopped

